name: Docker Bake Build and Push

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Nzyme alpha version (currently only 17 is supported)'},{
        required: true
        default: '17'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify upstream release before publishing
        env:
          VERSION: ${{ inputs.VERSION }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION" in
            17) ;;
            *) echo "::error::Unsupported Nzyme alpha version: $VERSION"; exit 1 ;;
          esac

          release="https://api.github.com/repos/nzymeorg/nzyme/releases/tags/2.0.0-alpha.$VERSION"
          if ! curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o "$RUNNER_TEMP/nzyme-release.json" "$release"; then
            echo "::error::No published Nzyme alpha.$VERSION release assets at $release; refusing to publish images."
            exit 1
          fi

          node="nzyme-node_ubuntu-2404noble-noarch-2.0.0-alpha.$VERSION.deb"
          tap="nzyme-tap_ubuntu-2404noble-amd64-2.0.0-alpha.$VERSION.deb"
          if ! jq -e --arg node "$node" --arg tap "$tap" \
            'any(.assets[]; .name == $node and .size > 0) and any(.assets[]; .name == $tap and .size > 0)' \
            "$RUNNER_TEMP/nzyme-release.json" >/dev/null; then
            echo "::error::Missing required Ubuntu 24.04 node or tap package in $release; refusing to publish images."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push with Docker Bake
        uses: docker/bake-action@v4
        with:
          files: |
            ./docker-bake.hcl
          push: true
          targets: |
            nzyme_node_v2
            nzyme_node_migration_v2
            nzyme_tap_v2
        env:
          VERSION: ${{ inputs.VERSION }}
