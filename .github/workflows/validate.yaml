name: Validate Docker images and example configuration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check scripts and Compose
        env:
          POSTGRES_PASSWORD: ci-example-only
        run: |
          set -euo pipefail
          bash -n build/v2/node/*.sh generate_tap_conf.sh
          sh -n build/v2/tap/start.sh
          docker compose config -q
          git diff --check
      - name: Check supported and unsupported Bake versions
        run: |
          set -euo pipefail
          VERSION=17 docker buildx bake -f docker-bake.hcl --print nzyme_node_v2 nzyme_node_migration_v2 nzyme_tap_v2 >/dev/null
          for version in 18 19; do
            if VERSION="$version" docker buildx bake -f docker-bake.hcl --print nzyme_node_v2 nzyme_node_migration_v2 nzyme_tap_v2; then
              echo "alpha.$version must not build until its packages are verified" >&2
              exit 1
            fi
          done
      - name: Check Dockerfile parsing
        run: |
          set -euo pipefail
          docker buildx build --check --build-context base_image=docker-image://ubuntu:24.04 --build-arg NZYME_USER_ID=1001 build/v2/node
          docker buildx build --check --build-context base_image=docker-image://ubuntu:24.04 build/v2/tap
